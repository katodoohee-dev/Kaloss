d:var(--mint-soft);color:var(--mint-ink)">2</span><span><strong>แปะหน้าผาก</strong><span>ถือแนวนอน</span></span></div><div class="how-item"><span class="how-num" style="background:var(--sky-soft);color:var(--sky-ink)">3</span><span><strong>ทายให้ไว</strong><span>ก้ม=ถูก เงย=ข้าม</span></span></div></div></section><div style="height:9rem"></div><div class="dock"><div class="dock-inner safe-x safe-bottom"><button class="primary press" onclick="beginPrep()">▶&nbsp;เล่น ${esc(d.name)}</button></div></div>`)}function renderDecks(){const q=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();return DECKS.filter(d=>!q||d.name.toLowerCase().includes(q)).filter(d=>activeFilter==="all"||activeFilter==="hot"&&d.badge==="HOT"||activeFilter==="new"&&d.badge==="NEW"||activeFilter==="easy"&&d.difficulty==="ง่าย").map(d=>{const [bg,ink]=toneMap[d.tone];return `<button class="deck-card press" style="background:${bg}" onclick="selectDeck('${d.id}')">${d.badge?`<span class="corner ${d.badge==='NEW'?'new':''}">${d.badge}</span>`:""}<div class="icon" style="color:${ink}">${d.icon}</div><h3 style="color:${ink}">${esc(d.name)}</h3><p>${esc(d.tagline)}</p><div class="meta"><span>▱ ${d.count} คำ</span><span>♧ ${d.players}</span></div></button>`}).join("")}function selectDeck(id){state.deckId=id;render();window.scrollTo(0,0)}function renderHomeDecks(){const el=document.getElementById("deckGrid");if(el)el.innerHTML=renderDecks()}function setFilter(btn,f){activeFilter=f;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");renderHomeDecks()}function permissionView(){return viewFrame(`<header class="topbar safe-top safe-x"><button class="icon-btn press" onclick="go('home')">‹</button><div class="title-center">เตรียมตัวเล่น</div><span></span></header><div class="panel-wrap safe-x"><div class="progress"><span class="on"></span><span class="${state.permission?'on':''}"></span><span class="${state.permission?'on':''}"></span></ tton>':'<button class="primary press" onclick="requestMotion()">อนุญาตและไปต่อ →</button>'}<button class="filter" style="width:100%;margin-top:7px" onclick="manualStart()">ข้ามขั้นตอนนี้ แล้วใช้ปุ่มแทน</button></div></div>`)}async function requestMotion(){try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted"){showToast("ต้องอนุญาตเซนเซอร์เพื่อเอียงเครื่อง");return}}state.permission=true;showToast("เปิดใช้การเอียงเครื่องแล้ว");render()}catch(e){state.permission=false;showToast("เบราว์เซอร์ไม่รองรับการเอียงเครื่อง ใช้ปุ่มแทนได้")}}function manualStart(){state.permission=false;state.tilt=false;startRound()}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startRound(){state.round=shuffle([...deck().words]).map(w=>({word:w,status:null}));state.wordIndex=0;state.score=0;state.passed=0;state.stage="countdown";state.count=3;state.startAt=0;primeAudio();wake();go("play");runCountdown()}function runCountdown(){playBeep(520,.07);const iv=setInterval(()=>{state.count--;if(state.count>0)playBeep(620,.06);else{clearInterval(iv);state.stage="neutral";startTimer();render()}render()},750)}function startTimer(){state.startAt=Date.now();clearInterval(state.timer);state.timer=setInterval(()=>{if(state.paused)return;const left=Math.max(0,state.duration*1000-(Date.now()-state.startAt));if(left<=0){finishRound();return}updateGameHud(left)},100)}function remaining(){return Math.max(0,state.duration*1000-(Date.now()-state.startAt))}function updateGameHud(ms){const el=document.getElementById("timeText"),m=document.getElementById("meter");if(!el)return;const sec=Math.ceil(ms/1000);el.textContent=`0:${String(sec).padStart(2,"0")}`;if(m)m.style.width=`${Math.max(0,ms/(state.duration*1000)*100)}%`;const s=document.getElementById("scoreText");if(s)s.textContent=state.score}function currentWord(){return state.round?.[state.wordIndex]?.word||""}function playView(){const left=remaining(),d=deck();return `<div class="game"><div class="gamebar"><button class="icon-btn press" onclick="pauseGame()">Ⅱ</button><div class="timerbar"><div id="timeText" class="stat">0:${String(Math.max(0,Math.ceil(left/1000))).padStart(2,"0")}</div><div class="meter"><span id="meter" style="width:${Math.max(0,left/(state.duration*1000)*100)}%"></span></div></div><div class="stat">✓ <span id="scoreText">${state.score}</span></div><button class="icon-btn press" onclick="quitRound()">×</button></div>${state.count>0&&state.stage==="countdown"?`<div class="overlay"><div class="modal">${mascot("excited","mascot-sm")}<div class="count">${state.count}</div><p>แปะเครื่องไว้ที่หน้าผาก แล้วให้เพื่อนเริ่มใบ้</p></div></div>`:""}<main class="game-main"><div class="word-card"><div><span class="eyebrow">${state.stage==="correct"?"ถูกต้อง!":state.stage==="pass"?"ข้ามคำนี้":esc(d.name)}</span><div id="word" class="word">${esc(currentWord())}</div><div class="hint">คำที่ ${state.wordIndex+1} จาก ${state.round?.length||0} · ก้ม = ถูก / เงย = ข้าม</div></div></div></main><div class="controls"><button class="control pass press" onclick="answer('pass')" ${state.stage!=="neutral"?"disabled":""}>→ ข้าม</button><button class="control correct press" onclick="answer('correct')" ${state.stage!=="neutral"?"disabled":""}>✓ ถูก!</button></div>${!state.tilt?'<div class="portrait-hint">ใช้ปุ่มได้เลย หรือเปิดการเอียงในตั้งค่า</div>':''}${renderGameOverlay()}</div>`}function renderGameOverlay(){if(state.stage==="timeup")return `<div class="overlay"><div class="modal">${mascot("oops","mascot-sm")}<h3>หมดเวลา!</h3><p>ได้ ${state.score} คำในรอบนี้</p><button class="primary" onclick="go('result')">ดูผลคะแนน</button></div></div>`;if(state.paused)return `<div class="overlay"><div class="modal">${mascot("sleepy","mascot-sm")}<h3>พักก่อนนะ</h3><p>เกมหยุดไว้ให้แล้ว กดเล่นต่อได้ทุกเมื่อ</p><button class="primary" onclick="resumeGame()">เล่นต่อ</button><button class="filter" style="width:100%;margin-top:8px" onclick="quitRound()">ออกจากรอบนี้</button></div></div>`;return ""}function answer(kind){if(state.stage!=="neutral"||!state.round)return;const now=Date.now();if(now-state.lastAction<1200)return;state.lastAction=now;state.stage=kind;if(kind==="correct"){state.score++;state.round[state.wordIndex].status="correct";playSfx("correct")}else{state.passed++;state.round[state.wordIndex].status="pass";playSfx("pass")}if(state.haptics&&navigator.vibrate)navigator.vibrate(kind==="correct"?30:[20,25,20]);render();setTimeout(()=>{if(!state.round)return;if(state.wordIndex>=state.round.length-1){finishRound()}else{state.wordIndex++;state.stage="neutral";render()}},650)}function finishRound(){clearInterval(state.timer);state.timer=null;state.stage="timeup";playSfx("timeup");if(state.wake)try{state.wake.release()}catch{}render();setTimeout(()=>go("result"),1100)}function pauseGame(){state.paused=true;clearInterval(state.timer);render()}function resumeGame(){state.paused=false;startTimer();render()}function quitRound(){clearInterval(state.timer);if(state.wake)try{state.wake.release()}catch{}go("home")}function confetti(){return '<div class="confetti">✦ ✧ ✦ ✧ ✦</div>'}function resultView(){const c=state.score,p=state.passed,words=state.round||[];return viewFrame(`<header class="topbar safe-top safe-x"><div></div><div class="title-center">จบรอบแล้ว!</div><button class="icon-btn press" onclick="go('home')">×</button></header><section class="result-hero safe-x">${confetti()}${mascot("cheer")}<div style="color:var(--muted);font-size:.7rem;font-weight:800">คะแนนรอบนี้</div><div class="score">${c}</div><div style="font-family:Mali;font-weight:900;font-size:1rem">คำใน ${state.duration} วินาที</div><div class="stat-grid"><div class="result-stat" style="background:var(--mint-soft);color:var(--mint-ink)"><strong>${c}</strong><span>ทายถูก</span></div><div class="result-stat" style="background:var(--butter-soft);color:var(--butter-ink)"><strong>${p}</strong><span>ข้าม</span></div><div class="result-stat" style="background:var(--sky-soft);color:var(--sky-ink)"><strong>${Math.round(state.duration/Math.max(c,1))}วิ</strong><span>เฉลี่ย/คำ</span></div></div></section><section class="safe-x panel-wrap"><div class="card panel"><div style="display:flex;align-items:center;gap:10px"><div class="deck-avatar">${deck().icon}</div><div style="min-width:0"><div class="eyebrow">หมวดที่เล่น</div><div style="font-family:Mali;font-weight:900">${esc(deck().name)}</div></div></div><div class="history"><h3>คำในรอบนี้</h3>${words.map((w,i)=>`<div class="history-row"><span class="n">${i+1}</span><span class="wordh">${esc(w.word)}</span><span class="status-dot ${w.status==='correct'?'ok':'skip'}">${w.status==='correct'?'✓':'→'}</span></div>`).join("")}</div><button class="filter press" style="width:100%;margin-top:12px" onclick="shareResult()">↗ แชร์ผลให้เพื่อน</button></div></section><div class="dock"><div class="dock-inner safe-x safe-bottom"><button class="primary press" onclick="startRound()">↻ &nbsp;เล่นอีกรอบ!</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="filter press" onclick="go('home')">เลือกหมวดใหม่</button><button class="filter press" onclick="go('home')">หน้าแรก</button></div></div></div>`)}function settingsView(){return viewFrame(`<header class="topbar safe-top safe-x"><button class="icon-btn press" onclick="go('home')">‹</button><div class="title-center">ตั้งค่า</div><span></span></header><div class="panel-wrap safe-x"><div class="card panel"><section class="settings-section"><h2>เวลาต่อรอบ</h2><div class="duration-grid">${[30,60,90].map(x=>`<button class="dur press ${state.duration===x?'active':''}" onclick="setDuration(${x})">${x}<div style="font-size:.62rem;opacity:.8">วินาที</div></button>`).join("")}</div></section><section class="settings-section"><h2>เสียงและการตอบสนอง</h2><div class="toggle-row"><span class="toggle-icon" style="background:var(--butter-soft);color:var(--butter-ink)">♪</span><span class="toggle-copy"><strong>เสียงในเกม</strong><span>นับถอยหลัง ถูก/ข้าม และหมดเวลา</span></span><button class="switch ${state.sound?'on':''}" onclick="setToggle('sound')"><i></i></button></div><div class="toggle-row"><span class="toggle-icon" style="background:var(--pink-soft);color:var(--pink-ink)">≋</span><span class="toggle-copy"><strong>สั่นเมื่อทายถูก</strong><span>ฟีดแบ็กเบา ๆ ตอนได้คะแนน</span></span><button class="switch ${state.haptics?'on':''}" onclick="setToggle('haptics')"><i></i></button></div><div class="toggle-row"><span class="toggle-icon" style="background:var(--sky-soft);color:var(--sky-ink)">↕</span><span class="toggle-copy"><strong>ควบคุมด้วยการเอียงเครื่อง</strong><span>ก้ม = ถูก · เงย = ข้าม</span></span><button class="switch ${state.tilt?'on':''}" onclick="setToggle('tilt')"><i></i></button></div></section><section class="settings-section"><h2>เกี่ยวกับ</h2><div style="padding:14px;border-radius:20px;background:var(--mint-soft);color:var(--mint-ink);font-size:.72rem;line-height:1.6">♡ Party Word Guess ใช้การเอียงเครื่องแบบเฉพาะกิจในขณะเล่น และมีปุ่มสำรองเสมอ</div></section></div></div><div class="dock"><div class="dock-inner safe-x safe-bottom"><button class="primary press" onclick="go('home')">บันทึกและกลับ</button></div></div>`)}async function shareResult(){const text=`🎉 Party Word Guess\nฉันทายถูก ${state.score} คำ และข้าม ${state.passed} คำ ใน ${state.duration} วินาที\nหมวด: ${deck().name}`;try{if(navigator.share)await navigator.share({title:"Party Word Guess",text});else{await navigator.clipboard.writeText(text);showToast("คัดลอกผลคะแนนแล้ว")}}catch{}}function go(screen){state.screen=screen;if(screen!=="play")clearInterval(state.timer);render()}function beginPrep(){state.permission=false;go("permission")}function setDuration(x){state.duration=x;localStorage.setItem("pwg.duration",x);render()}function setToggle(k){state[k]=!state[k];localStorage.setItem("pwg."+k,state[k]?"1":"0");render()}function primeAudio(){if(state.audio)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)state.audio=new C()}catch{}}function tone(freq,dur){if(!state.sound||!state.audio)return;const ctx=state.audio,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.08,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur+.02)}function playBeep(f,d){primeAudio();if(state.audio&&state.audio.state==="suspended")state.audio.resume();tone(f,d)}function playSfx(k){if(k==="correct")tone(740,.12);else if(k==="pass")tone(420,.10);else {tone(260,.18);setTimeout(()=>tone(190,.22),120)}}async function wake(){try{if("wakeLock" in navigator)state.wake=await navigator.wakeLock.request("screen")}catch{}}async function requestMotion(){try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted"){showToast("ต้องอนุญาตเซนเซอร์เพื่อเอียงเครื่อง");return}}state.permission=true;showToast("เปิดใช้การเอียงเครื่องแล้ว");render()}catch{state.permission=false;showToast("ใช้ปุ่มสำรองได้");render()}}function manualStart(){state.tilt=false;startRound()}function startRound(){state.round=shuffle([...deck().words]).map(w=>({word:w,status:null}));state.wordIndex=0;state.score=0;state.passed=0;state.stage="countdown";state.count=3;state.startAt=0;primeAudio();wake();go("play");runCountdown()}function runCountdown(){playBeep(520,.07);const iv=setInterval(()=>{state.count--;if(state.count>0)playBeep(620,.06);else{clearInterval(iv);state.stage="neutral";startTimer();render()}render()},750)}function startTimer(){state.startAt=Date.now();clearInterval(state.timer);state.timer=setInterval(()=>{if(state.paused)return;const left=Math.max(0,state.duration*1000-(Date.now()-state.startAt));if(left<=0){finishRound();return}updateGameHud(left)},100)}function remaining(){return Math.max(0,state.duration*1000-(Date.now()-state.startAt))}function pauseGame(){state.paused=true;clearInterval(state.timer);render()}function resumeGame(){state.paused=false;startTimer();render()}function quitRound(){clearInterval(state.timer);if(state.wake)try{state.wake.release()}catch{}go("home")}function finishRound(){clearInterval(state.timer);state.timer=null;state.stage="timeup";playSfx("timeup");if(state.wake)try{state.wake.release()}catch{}render();setTimeout(()=>go("result"),1100)}function answer(kind){if(state.stage!=="neutral"||!state.round)return;const now=Date.now();if(now-state.lastAction<1200)return;state.lastAction=now;state.stage=kind;if(kind==="correct"){state.score++;state.round[state.wordIndex].status="correct";playSfx("correct")}else{state.passed++;state.round[state.wordIndex].status="pass";playSfx("pass")}if(state.haptics&&navigator.vibrate)navigator.vibrate(kind==="correct"?30:[20,25,20]);render();setTimeout(()=>{if(!state.round)return;if(state.wordIndex>=state.round.length-1)finishRound();else{state.wordIndex++;state.stage="neutral";render()}},650)}function updateGameHud(ms){const t=document.getElementById("timeText"),m=document.getElementById("meter"),s=document.getElementById("scoreText");if(t)t.textContent=`0:${String(Math.ceil(ms/1000)).padStart(2,"0")}`;if(m)m.style.width=`${Math.max(0,ms/(state.duration*1000)*100)}%`;if(s)s.textContent=state.score}function playView(){const left=remaining(),d=deck();return `<div class="game"><div class="gamebar"><button class="icon-btn press" onclick="pauseGame()">Ⅱ</button><div class="timerbar"><div id="timeText" class="stat">0:${String(Math.max(0,Math.ceil(left/1000))).padStart(2,"0")}</div><div class="meter"><span id="meter" style="width:${Math.max(0,left/(state.duration*1000)*100)}%"></span></div></div><div class="stat">✓ <span id="scoreText">${state.score}</span></div><button class="icon-btn press" onclick="quitRound()">×</button></div>${state.stage==="countdown"&&state.count>0?`<div class="overlay"><div class="modal">${mascot("excited","mascot-sm")}<div class="count">${state.count}</div><p>แปะเครื่องไว้ที่หน้าผาก แล้วให้เพื่อนเริ่มใบ้</p></div></div>`:""}<main class="game-main"><div class="word-card"><div><span class="eyebrow">${state.stage==="correct"?"ถูกต้อง!":state.stage==="pass"?"ข้ามคำนี้":esc(d.name)}</span><div class="word">${esc(currentWord())}</div><div class="hint">คำที่ ${state.wordIndex+1} จาก ${state.round?.length||0} · ก้ม = ถูก / เงย = ข้าม</div></div></div></main><div class="controls"><button class="control pass press" onclick="answer('pass')" ${state.stage!=="neutral"?"disabled":""}>→ ข้าม</button><button class="control correct press" onclick="answer('correct')" ${state.stage!=="neutral"?"disabled":""}>✓ ถูก!</button></div>${state.paused?'<div class="overlay"><div class="modal">'+mascot('sleepy','mascot-sm')+'<h3>พักก่อนนะ</h3><p>เกมหยุดไว้ให้แล้ว</p><button class="primary" onclick="resumeGame()">เล่นต่อ</button><button class="filter" style="width:100%;margin-top:8px" onclick="quitRound()">ออกจากรอบนี้</button></div></div>':''}</div>`}function renderDecks(){const q=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();return DECKS.filter(d=>!q||d.name.toLowerCase().includes(q)).filter(d=>activeFilter==="all"||activeFilter==="hot"&&d.badge==="HOT"||activeFilter==="new"&&d.badge==="NEW"||activeFilter==="easy"&&d.difficulty==="ง่าย").map(d=>{const [bg,ink]=toneMap[d.tone];return `<button class="deck-card press" style="background:${bg}" onclick="selectDeck('${d.id}')">${d.badge?`<span class="corner ${d.badge==='NEW'?'new':''}">${d.badge}</span>`:""}<div class="icon" style="color:${ink}">${d.icon}</div><h3 style="color:${ink}">${esc(d.name)}</h3><p>${esc(d.tagline)}</p><div class="meta"><span>▱ ${d.count} คำ</span><span>♧ ${d.players}</span></div></button>`}).join("")}function render(){const app=document.getElementById("app");app.innerHTML=state.screen==="home"?home():state.screen==="permission"?permissionView():state.screen==="play"?playView():state.screen==="result"?resultView():settingsView();if(state.screen==="play")requestAnimationFrame(()=>updateGameHud(remaining()))}window.addEventListener("deviceorientation",e=>{if(state.screen!=="play"||!state.tilt||state.paused||state.stage!=="neutral")return;const b=typeof e.beta==="number"?e.beta:0;const now=Date.now();if(now-state.lastAction<1200)return;if(Math.abs(b)<25)return;if(b>40)answer("correct");else if(b<-40)answer("pass")},{passive:true});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&state.screen==="play")wake()});render();</script></body></html>
