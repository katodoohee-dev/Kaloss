services:
  - type: web
    runtime: static
    name: party-word-guess
    buildCommand: echo "static-site"
    staticPublishPath: pwg-runtime
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
